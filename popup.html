<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .header {
      padding: 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }
    
    .header h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .container {
      padding: 15px;
      max-height: 500px;
      overflow-y: auto;
    }
    
    .platform-section {
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      backdrop-filter: blur(10px);
    }
    
    .platform-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .platform-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
    }
    
    .leetcode { background: #FFA116; }
    .codeforces { background: #1F8ACB; }
    .codechef { background: #5B4638; }
    
    .problem-item {
      background: rgba(255, 255, 255, 0.15);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .problem-item:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    
    .problem-item .problem-info {
      flex: 1;
      cursor: pointer;
    }
    
    .problem-name {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    
    .problem-time {
      font-size: 11px;
      opacity: 0.7;
    }
    
    .problem-status {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    
    .status-solved {
      background: #10b981;
    }
    
    .status-unsolved {
      background: #f59e0b;
    }
    
    .empty-state {
      text-align: center;
      padding: 30px;
      opacity: 0.8;
    }
    
    .empty-state p {
      font-size: 14px;
      margin-bottom: 8px;
    }
    
    .clear-btn {
      background: rgba(239, 68, 68, 0.3);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
      margin-top: 10px;
    }
    
    .clear-btn:hover {
      background: rgba(239, 68, 68, 0.5);
    }
    
    .mark-solved-btn {
      background: rgba(16, 185, 129, 0.3);
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .mark-solved-btn:hover {
      background: rgba(16, 185, 129, 0.5);
      transform: scale(1.1);
    }
    
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎯 Coding Tracker</h1>
    <p>Your recent problems across platforms</p>
  </div>
  
  <div class="container" id="container">
    <div class="empty-state">
      <p>No problems tracked yet!</p>
      <p style="font-size: 12px;">Visit problems on LeetCode, Codeforces, or CodeChef to start tracking.</p>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
